[package]
name = "erebor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slug = "0.1.6"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "uuid"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["serde", "v4"] }
validator = { version = "0.21.0", features = ["derive"] }
